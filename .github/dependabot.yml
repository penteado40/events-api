version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Majors de Prisma e NestJS são migrações planejadas, não PRs automáticos.
      - dependency-name: prisma
        update-types: [version-update:semver-major]
      - dependency-name: '@prisma/*'
        update-types: [version-update:semver-major]
      - dependency-name: '@nestjs/*'
        update-types: [version-update:semver-major]
      # TypeScript 7 espera o typescript-eslint suportá-lo (peer atual: <6.1.0).
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # @types/node acompanha o runtime (engines/.nvmrc: Node 22); sobe junto com ele.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        update-types: [minor, patch]
